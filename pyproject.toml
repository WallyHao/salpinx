[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "salpinx"
version = "0.1.0"
description = "Annotation-style pub/sub and service/request for zenoh"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "waliwuao" }]
keywords = ["zenoh", "pub-sub", "rpc", "annotations"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "eclipse-zenoh>=1.0",
    "msgpack>=1.2.1",
]

[project.urls]
Repository = "https://github.com/waliwuao/salpinx"
Issues = "https://github.com/waliwuao/salpinx/issues"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=7.1.0"]
# ruff and mypy are provided by nix flake for NixOS compatibility

[tool.uv]
exclude-newer = "2026-07-29T00:00:00Z"

[tool.hatch.build.targets.wheel]
packages = ["src/salpinx"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I",
    "UP",
    "B", "S", "A", "ISC", "ICN",
    "C4", "SIM", "PIE", "RET", "ARG", "ERA", "PL",
    "PERF",
    "COM", "PTH", "SLF", "T20", "LOG",
    "D",
    "PT",
    "N",
    "TRY", "EM",
    "DTZ",
    "PGH", "RUF",
]
ignore = [
    "E501",
    "COM812",
    "ISC001",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",
    "ARG001",
    "PLR2004",
    "T20",
    "D1",
    "SLF001",
    "PT019",
    "TRY003",
    "EM101",
    "ARG005",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
show_error_codes = true
enable_error_code = ["ignore-without-code", "redundant-cast", "truthy-bool"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["msgpack", "zenoh"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-v",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
show_missing = true
